<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>VibeCheck Configuration</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, 'Courier New', monospace;
            padding: 20px;
            width: 400px;
        }

        h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #9cdcfe;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            background-color: #252526;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1177bb;
        }

        #status {
            margin-top: 10px;
            color: #4ec9b0;
            height: 20px;
            font-size: 0.9em;
        }

        .note {
            font-size: 0.8em;
            color: #808080;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h2>⚙️ VibeCheck Config</h2>

    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
    <div class="note">Google AI Studio API Key</div>

    <label for="systemPrompt">System Prompt (Criteria)</label>
    <textarea id="systemPrompt" placeholder="Define what constitutes a 'Bad Vibe' here..."></textarea>
    <div class="note">Leave empty to use default logic.</div>

    <button id="saveBtn">Save Configuration</button>
    <div id="status"></div>

    <script src="dist/options.js"></script>
</body>

</html>
